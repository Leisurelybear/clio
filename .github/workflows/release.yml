name: Release desktop build

# Build the Clio desktop shell (PyInstaller onedir) for Windows x64 and macOS
# (universal2: Intel + Apple Silicon) and publish a GitHub Release with the
# packaged apps as zip assets.
#
# Windows ARM64 runs the x64 build via built-in emulation (pythonnet has no
# native win_arm64 wheel), so no separate ARM64 artifact is produced.
#
# Triggers:
#   - push a semver tag:  git tag v0.1.0 && git push origin v0.1.0
#   - manual run:         Actions -> "Release desktop build" -> Run workflow
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0). Defaults to the git tag."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Compute release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Compute release version
        id: version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          VER="$VERSION_INPUT"
          if [ -z "$VER" ]; then
            if [ "$EVENT_NAME" = "push" ]; then
              VER="$REF_NAME"
              VER="${VER#v}"
            else
              VER="0.0.0-dev"
            fi
          fi
          # Strict semver guard: the manual-run version is user input and must
          # never be interpolated into shell scripts (command substitution / bad
          # artifacts). Pass it to consumers only via output plus env, never by
          # embedding it in a run: script.
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "release version is not valid semver: $VER" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build onedir (Windows x64)
    runs-on: windows-latest
    needs: version
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-locked.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-locked.txt
          pip install pyinstaller pywebview pythonnet

      - name: Build onedir
        run: python -m PyInstaller packaging/clio.spec --noconfirm --clean

      - name: Verify artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/clio/clio.exe")) { throw "clio.exe not built" }
          if (-not (Test-Path "dist/clio/_internal/clio/ui/static/index.html")) { throw "static assets missing" }
          Write-Output "onedir OK"

      - name: Copy desktop README next to exe
        shell: pwsh
        run: |
          Copy-Item "packaging/README-desktop.md" (Join-Path "dist/clio" "README-desktop.md") -Force
          if (-not (Test-Path "dist/clio/README-desktop.md")) { throw "README-desktop.md missing in bundle" }

      - name: Smoke test server startup
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "clio-smoke"
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Copy-Item "config.example.yaml" (Join-Path $work "config.yaml") -Force
          $p = Start-Process -FilePath "$PWD/dist/clio/clio.exe" -WorkingDirectory $work -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            $conn = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.OwningProcess -eq $p.Id } | Select-Object -First 1
            if ($conn) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$($conn.LocalPort)/" -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            Start-Sleep -Milliseconds 500
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "desktop server did not serve index" }
          Write-Output "smoke OK"

      - name: Package onedir as zip
        shell: pwsh
        run: |
          $name = "clio-${{ needs.version.outputs.version }}-windows-x64"
          Compress-Archive -Path "dist/clio" -DestinationPath "$name.zip" -CompressionLevel Optimal
          Write-Output "artifact=$name.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clio-${{ needs.version.outputs.version }}-windows-x64
          path: clio-${{ needs.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  build-macos:
    name: Build onedir (macOS universal2)
    runs-on: macos-26-intel
    needs: version
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install universal2 Python (python.org)
        run: |
          # GitHub-hosted Python is single-arch; PyInstaller universal2 needs a
          # universal2 interpreter + universal2 wheels (pyobjc ships them).
          curl -L -o python.pkg "https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.11/bin" >> "$GITHUB_PATH"

      - name: Install build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-locked.txt
          python3 -m pip install pyinstaller
          # macOS GUI backend: Cocoa/WebKit via pyobjc (universal2 wheels).
          python3 -m pip install "pywebview" "pyobjc-core" "pyobjc-framework-Cocoa" "pyobjc-framework-WebKit" "pyobjc-framework-Quartz" "pyobjc-framework-Security"

      - name: Build onedir (universal2)
        run: python3 -m PyInstaller packaging/clio.spec --target-architecture universal2 --noconfirm --clean

      - name: Verify artifacts
        run: |
          test -f "dist/clio.app/Contents/MacOS/clio" || { echo "clio binary missing"; exit 1; }
          # datas land under Contents/Resources (or Contents/Resources/_internal) in v6+.
          if ! find "dist/clio.app" -name "index.html" -path "*ui/static*" | grep -q .; then
            echo "static assets missing"
            exit 1
          fi
          # lipo -info never prints "universal2" (it lists the actual archs), so
          # assert BOTH archs explicitly present via lipo -archs.
          archs="$(lipo -archs "dist/clio.app/Contents/MacOS/clio")"
          echo "binary archs: $archs"
          case "$archs" in
            *x86_64*arm64*|*arm64*x86_64*) echo "universal2 OK" ;;
            *) echo "not a universal2 binary (missing x86_64 or arm64)"; exit 1 ;;
          esac
          echo "app OK"

      - name: Smoke test packaged app startup
        timeout-minutes: 5
        run: |
          set -e
          work="$(mktemp -d)"
          cp config.example.yaml "$work/config.yaml"
          "$PWD/dist/clio.app/Contents/MacOS/clio" -c "$work/config.yaml" >/tmp/clio-smoke.log 2>&1 &
          pid=$!
          ok=
          for _ in $(seq 1 60); do
            port="$(lsof -nP -iTCP:127.0.0.1 -sTCP:LISTEN -a -p "$pid" 2>/dev/null | awk 'NR>1{print $9}' | cut -d: -f2 | head -n1)"
            if [ -n "$port" ]; then
              if curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/" | grep -q 200; then
                ok=1
                break
              fi
            fi
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ -z "$ok" ]; then
            echo "desktop app did not serve index"
            cat /tmp/clio-smoke.log
            exit 1
          fi
          echo "launch smoke OK"

      - name: Package app as zip (app + README)
        run: |
          name="clio-${{ needs.version.outputs.version }}-macos-universal2"
          staging="$RUNNER_TEMP/$name"
          mkdir -p "$staging"
          cp -R dist/clio.app "$staging/clio.app"
          cp packaging/README-desktop.md "$staging/README-desktop.md"
          test -f "$staging/README-desktop.md" || { echo "README-desktop.md missing in bundle"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$staging" "$name.zip"
          test -f "$name.zip" || { echo "zip not created"; exit 1; }
          echo "artifact=$name.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clio-${{ needs.version.outputs.version }}-macos-universal2
          path: clio-${{ needs.version.outputs.version }}-macos-universal2.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ needs.version.outputs.version }}"
          tag="${{ github.ref_name }}"
          gh release create "$tag" \
            artifacts/clio-${VER}-windows-x64/*.zip \
            artifacts/clio-${VER}-macos-universal2/*.zip \
            --title "Clio $tag" \
            --notes "Desktop builds for Windows x64 and macOS (universal2, Intel + Apple Silicon). See packaging/README-desktop.md for WebView2 / ffmpeg / SmartScreen notes. Windows ARM64: use the x64 build (runs under emulation)." \
            --repo "${{ github.repository }}"
