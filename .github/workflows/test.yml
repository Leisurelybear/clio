name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (lint + import)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements-locked.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-locked.txt
        pip install ruff mypy

    - name: Lint (ruff check)
      run: ruff check clio main.py --output-format=github

    - name: Format check (ruff format)
      run: ruff format --check clio main.py

    - name: Type check (mypy)
      run: |
        # Phase 4d: CI gate for type hardening
        # Progressive scope driven by [tool.mypy] files in pyproject.toml
        # (P2-P30): every listed module passes --check-untyped-defs.
        mypy --check-untyped-defs --show-error-codes
        echo "Core module type check passed"

    - name: Import check
      run: python -c "import clio; print('import OK')"

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements-locked.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-locked.txt
        pip install pytest pytest-cov pytest-randomly

    - name: Run tests with coverage
      run: |
        python -m pytest clio/tests/ -p randomly --cov=clio --cov-branch --cov-report=term --cov-report=xml --cov-config=pyproject.toml

    - name: Check tests left the working tree clean
      # bash syntax; the default Windows runner shell is PowerShell.
      shell: bash
      run: |
        dirty=$(git status --porcelain --untracked-files=all)
        if [ -n "$dirty" ]; then
          echo "Tests polluted the repository working tree:"
          echo "$dirty"
          exit 1
        fi
        echo "Working tree clean after tests"

    - name: Upload pytest logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-logs-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          .pytest_cache/
          coverage.xml
        if-no-files-found: ignore

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        fail_ci_if_error: false

  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements-locked.txt
    - name: Install and audit
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-locked.txt pip-audit
        pip-audit -r requirements-locked.txt

  ui-test:
    name: UI tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run UI tests
      run: npm test

    - name: UI coverage gate
      run: npm run test:coverage

  setup:
    name: Setup script validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install yaml for config validation
      run: pip install pyyaml

    - name: Check setup.sh syntax
      run: |
        if [ -f setup.sh ]; then
          bash -n setup.sh
          echo "setup.sh syntax OK"
        else
          echo "setup.sh not found -- skipping"
        fi

    - name: Check entry-point git hooks are executable
      run: |
        for hook in .githooks/pre-commit .githooks/pre-push; do
          if [ -f "$hook" ]; then
            test -x "$hook" || { echo "ERROR: $hook is not executable (track as 0o755)"; exit 1; }
          fi
        done
        echo "entry-point hooks are executable"

    - name: Validate config.example.yaml
      run: |
        python -c "import yaml; yaml.safe_load(open('config.example.yaml')); print('config.example.yaml: valid YAML')"

    - name: Check requirements files
      run: |
        echo "requirements.txt:"; wc -l requirements.txt
        echo "requirements-locked.txt:"; wc -l requirements-locked.txt

  setup-windows:
    name: Setup script validation (Windows PowerShell)
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Parse-check setup.ps1 (UTF-8 aware)
      shell: pwsh
      run: |
        $path = Join-Path $env:GITHUB_WORKSPACE 'setup.ps1'
        if (Test-Path $path) {
          $text = [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8)
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error "L$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Output "setup.ps1 syntax OK"
        } else {
          Write-Output "setup.ps1 not found -- skipping"
        }

    - name: Dry-run setup.ps1
      shell: pwsh
      env:
        CLIO_SETUP_DRYRUN: "1"
      run: |
        & ./setup.ps1
        Write-Output "setup.ps1 dry-run OK"

  desktop-build:
    name: Desktop bundle build (PyInstaller)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # P2-P32: the PR workflow never built the desktop bundle, so spec/datas
    # regressions surfaced only at release time. Validate the bundle builds on
    # every PR that touches packaging or the desktop/UI it bundles.
    if: startsWith(github.ref, 'refs/pull/')
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements-locked.txt

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-locked.txt
        pip install pyinstaller

    - name: Build onedir with the release spec
      run: python -m PyInstaller packaging/clio.spec --noconfirm --clean

    - name: Verify artifacts
      run: |
        test -f "dist/clio/clio" || { echo "clio binary not built"; exit 1; }
        find "dist/clio" -name "index.html" -path "*ui/static*" | grep -q . || { echo "static assets missing"; exit 1; }
        echo "desktop bundle build OK"

  packaging:
    name: Package build + install verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Build wheel
      run: |
        python -m pip install --upgrade pip
        pip install build
        python -m build --wheel

    - name: Install wheel into clean venv
      run: |
        python -m venv "$RUNNER_TEMP/verify-venv"
        "$RUNNER_TEMP/verify-venv/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/verify-venv/bin/python" -m pip install dist/clio-*.whl

    - name: Verify installed package (import + static assets)
      run: |
        "$RUNNER_TEMP/verify-venv/bin/python" -c "
        import clio
        from clio.ui.server import STATIC_DIR
        from clio.config import load_config
        assert STATIC_DIR.is_dir(), 'static dir missing from wheel'
        assert (STATIC_DIR / 'index.html').is_file(), 'index.html missing from wheel'
        print('import OK, static assets OK')
        "
