name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (lint + import)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements-locked.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-locked.txt
        pip install ruff mypy

    - name: Lint (ruff check)
      run: ruff check clio main.py --output-format=github

    - name: Format check (ruff format)
      run: ruff format --check clio main.py

    - name: Type check (mypy)
      run: |
        # Phase 4d: CI gate for type hardening
        # Core modules with strict checking (excluding AI module)
        mypy clio/config/ clio/progress.py clio/export/__init__.py clio/log.py clio/schema.py clio/_str_enum.py --check-untyped-defs --show-error-codes
        echo "Core module type check passed"

    - name: Import check
      run: python -c "import clio; print('import OK')"

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements-locked.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-locked.txt
        pip install pytest pytest-cov

    - name: Run tests with coverage
      run: |
        python -m pytest clio/tests/ --cov=clio --cov-branch --cov-report=term --cov-report=xml

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        fail_ci_if_error: false

  ui-test:
    name: UI tests (Vitest)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run UI tests
      run: npm test

  setup:
    name: Setup script validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install yaml for config validation
      run: pip install pyyaml

    - name: Check setup.sh syntax
      run: |
        if [ -f setup.sh ]; then
          bash -n setup.sh
          echo "setup.sh syntax OK"
        else
          echo "setup.sh not found -- skipping"
        fi

    - name: Check entry-point git hooks are executable
      run: |
        for hook in .githooks/pre-commit .githooks/pre-push; do
          if [ -f "$hook" ]; then
            test -x "$hook" || { echo "ERROR: $hook is not executable (track as 0o755)"; exit 1; }
          fi
        done
        echo "entry-point hooks are executable"

    - name: Validate config.example.yaml
      run: |
        python -c "import yaml; yaml.safe_load(open('config.example.yaml')); print('config.example.yaml: valid YAML')"

    - name: Check requirements files
      run: |
        echo "requirements.txt:"; wc -l requirements.txt
        echo "requirements-locked.txt:"; wc -l requirements-locked.txt

  setup-windows:
    name: Setup script validation (Windows PowerShell)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Parse-check setup.ps1 (UTF-8 aware)
      shell: pwsh
      run: |
        $path = Join-Path $env:GITHUB_WORKSPACE 'setup.ps1'
        if (Test-Path $path) {
          $text = [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8)
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error "L$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Output "setup.ps1 syntax OK"
        } else {
          Write-Output "setup.ps1 not found -- skipping"
        }

    - name: Dry-run setup.ps1
      shell: pwsh
      env:
        CLIO_SETUP_DRYRUN: "1"
      run: |
        & ./setup.ps1
        Write-Output "setup.ps1 dry-run OK"

  packaging:
    name: Package build + install verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Build wheel
      run: |
        python -m pip install --upgrade pip
        pip install build
        python -m build --wheel

    - name: Install wheel into clean venv
      run: |
        python -m venv "$RUNNER_TEMP/verify-venv"
        "$RUNNER_TEMP/verify-venv/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/verify-venv/bin/python" -m pip install dist/clio-*.whl

    - name: Verify installed package (import + static assets)
      run: |
        "$RUNNER_TEMP/verify-venv/bin/python" -c "
        import clio
        from clio.ui.server import STATIC_DIR
        from clio.config import load_config
        assert STATIC_DIR.is_dir(), 'static dir missing from wheel'
        assert (STATIC_DIR / 'index.html').is_file(), 'index.html missing from wheel'
        print('import OK, static assets OK')
        "
