# 项目级配置示例（project.yaml）
#
# 项目级配置覆盖对应项目的个性化设置。与 config.yaml（全局配置）互补，
# 放在 <项目>/project.yaml 中。不存在时使用默认值。
#
# 属于项目级的配置项：
#   paths: output_dir
#   ai: tasks, context, context_file
#   compress: target_size_mb, max_width, min_video_kbps, max_video_kbps
#   analyze: window_max_min, window_overlap_sec, max_analyze_duration_min, ...
#   script, plan, export
#   whisper: enabled, model_size, language, device, max_segments_per_clip, transcripts_subdir, engine

paths:
  # 注意：原始视频不再通过 input_dir 配置。
  # 请在 Web UI 中打开项目 → "视频管理" → 内嵌文件浏览器勾选。
  output_dir: "./output"

# AI 任务覆盖（可选；provider 必须在全局 config.yaml 中声明）
# 未在此覆盖的任务会沿用 config.yaml 的 ai.default_tasks。
ai:
  context: ""               # 项目特定的额外上下文（追加到 trip_context.md 之后）
  # context_file: ./templates/trip_context.md
  tasks:
    video_analyze:
      provider: gemini
      model: gemini-3-flash
      temperature: 0.2
    voiceover:
      provider: deepseek
      model: deepseek-flash
    vlog_plan:
      provider: deepseek
      model: deepseek-v4-pro
      # 规划输出较长；留空则沿用 provider 的 timeout_sec
      timeout_sec: 300

compress:
  target_size_mb: 5              # 0 = CRF mode using global compress.crf; >0 is a best-effort size budget
  max_width: 640                # high analysis recommends 960-1280 after re-compress
  min_video_kbps: 800           # long clips keep this analysis-quality floor
  max_video_kbps: 8000          # short clips are capped to avoid extreme bitrate

analyze:
  compressed_subdir: compressed
  texts_subdir: texts
  skip_existing: true
  max_analyze_duration_min: 0   # whole-clip hard cap; 0 = unlimited
  window_max_min: 15            # single Gemini window length (minutes)
  window_overlap_sec: 20        # overlap between windows for boundary dedupe
  media_resolution: medium      # low | medium | high; medium + window_max_min: 5 is recommended for long clips
  max_workers: 1
  # Optional: inject GoPro GPMF / sidecar summary into AI analyze context.
  # Default false. Missing GPS/GPMF is always a silent no-op.
  use_gpmf: false

script:
  scripts_subdir: scripts
  template_file: ./templates/vlog_template.md
  target_words: 80              # 单条口播字数上限；短素材按 timeline 时长自动缩短

plan:
  plans_subdir: plans
  max_clips_per_day: 12          # maximum distinct source clips used per day
  max_segments: 40               # maximum final timeline segments across those sources
  target_duration_sec: 180
  max_timeline_rows_per_clip: 8  # 0 = do not truncate detailed analysis rows
  max_key_moments_per_clip: 6    # 0 = do not truncate highlights/key moments
  max_candidate_clips: 60        # 0 = disable two-stage candidate shortlist
  visual_transition_review: false  # optional Gemini contact-sheet review of adjacent transitions

export:
  canvas_ratio: 16:9
  output_subdir: export

# plan 预览字幕显示外观 (project-scoped)
preview:
  subtitles:
    enabled: true
    mode: auto          # auto | multi | scroll
    max_lines: 2
    max_len_per_line: 16
    min_font_size: 14
    scroll_speed: 40
    font_size: 22
    font_color: "#ffffff"
    background: "rgba(0,0,0,0.55)"
    outline: "0 0 2px rgba(0,0,0,0.8)"
    pos_x: 50
    pos_y: 8

# Whisper ASR 项目级覆盖
whisper:
  enabled: true
  model_size: medium
  language: zh
  device: auto
  max_segments_per_clip: 5
  transcripts_subdir: transcripts
  # ASR 引擎 id: local（faster-whisper）或云端 provider（如 aliyun）
  engine: local
  # 云端引擎需在 .env 中配置 DASHSCOPE_API_KEY=...（阿里云百炼平台申请）
