[project]
name = "clio"
version = "0.1.0"
description = "AI preprocessing pipeline for travel vlog editing"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
dependencies = [
    "google-genai>=2.7.0",
    "httpx[socks]>=0.28.1",
    "pyyaml>=6.0.3",
    "pywebview>=5.0",
]

[project.scripts]
clio = "clio.main:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

# Single flat-layout package `clio`; exclude tests and repo-level helpers so
# setuptools does not mistake them for top-level packages.
[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["clio", "clio.*"]
exclude = ["clio.tests*", "clio*.tests", "packaging*"]

# Static UI assets must travel inside the wheel: the HTTP server resolves
# them via `Path(__file__).parent / "static"` at runtime.
[tool.setuptools.package-data]
clio = ["ui/static/**/*", "ui/static/**/.*"]

[tool.pytest.ini_options]
testpaths = ["clio/tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
# Progressive type-hardening scope (P2-P30): modules that pass under
# --check-untyped-defs. Expand as more modules are hardened; do not add a
# module here until `mypy <module> --check-untyped-defs --show-error-codes`
# reports zero issues.
files = [
    "clio/config/",
    "clio/progress.py",
    "clio/export/__init__.py",
    "clio/log.py",
    "clio/schema.py",
    "clio/_str_enum.py",
    "clio/identity.py",
    "clio/vmeta.py",
    "clio/utils.py",
    "clio/plan_model.py",
    "clio/plan_readiness.py",
    "clio/compress.py",
    "clio/analyze_windows.py",
    "clio/cut.py",
    "clio/shutdown.py",
    "clio/ai/",
    "clio/tasks/_helpers.py",
    "clio/tasks/transcript_align.py",
]

[tool.coverage.run]
branch = true
source = ["clio"]
omit = [
    "clio/tests/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
# P2-P30: real production metrics against an explicit floor. Measured total
# on a local Python 3.11 Windows run is ~76% (branch enabled); keep the gate
# below the measured values so it catches regressions without being flaky
# across the 3x2 CI matrix.
fail_under = 70
